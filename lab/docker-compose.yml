# =============================================================================
# INF2005 ACW3 - lab topology
# -----------------------------------------------------------------------------
#   target          httpd 2.4.68  (VULNERABLE)   172.28.0.10   host :8080 -> :80
#   backend         untrusted backend fixture    172.28.0.20   (internal only)
#   attacker        Kali assessment box          172.28.0.100
#   target-patched  httpd 2.4.69  (REMEDIATED)   172.28.0.11   host :8081 -> :80
#                   (only starts with:  docker compose --profile remediation up)
#
# Single isolated bridge network, no exposure beyond the host loopback mapping.
# Bring up:   docker compose up -d --build
# =============================================================================

services:
  target:
    build:
      context: ./target
      args:
        HTTPD_VERSION: "2.4.68"
    image: acw3/target:2.4.68
    container_name: acw3-target
    environment:
      LAB_CONF: lab-vuln.conf
      DAV_USER: "${DAV_USER:-davuser}"
      DAV_PASS: "${DAV_PASS:-LabPass123}"
      DIGEST_USER: "${DIGEST_USER:-digestuser}"
      DIGEST_PASS: "${DIGEST_PASS:-LabPass123}"
      DIGEST_REALM: "ACW3 Restricted"
    ports:
      - "127.0.0.1:8080:80"      # bound to loopback only
    networks:
      acwnet:
        ipv4_address: 172.28.0.10
    depends_on:
      - backend
    restart: "no"

  backend:
    build:
      context: ./backend
    image: acw3/backend:1.0
    container_name: acw3-backend
    networks:
      acwnet:
        ipv4_address: 172.28.0.20
    expose:
      - "8000"                   # reachable only inside acwnet (by target)
    restart: "no"

  attacker:
    build:
      context: ./attacker
    image: acw3/attacker:kali
    container_name: acw3-attacker
    networks:
      acwnet:
        ipv4_address: 172.28.0.100
    cap_add:
      - NET_RAW                  # allow ping / nmap raw sockets inside the lab
    tty: true
    stdin_open: true
    restart: "no"

  target-patched:
    build:
      context: ./target
      args:
        HTTPD_VERSION: "2.4.69"
    image: acw3/target:2.4.69
    container_name: acw3-target-patched
    environment:
      LAB_CONF: lab-hardened.conf
      DAV_USER: "${DAV_USER:-davuser}"
      DAV_PASS: "${DAV_PASS:-LabPass123}"
      DIGEST_USER: "${DIGEST_USER:-digestuser}"
      DIGEST_PASS: "${DIGEST_PASS:-LabPass123}"
      DIGEST_REALM: "ACW3 Restricted"
    ports:
      - "127.0.0.1:8081:80"
    networks:
      acwnet:
        ipv4_address: 172.28.0.11
    depends_on:
      - backend
    profiles:
      - remediation              # opt-in: docker compose --profile remediation up
    restart: "no"

networks:
  acwnet:
    name: acwnet
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
