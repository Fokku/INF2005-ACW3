# =============================================================================
# INF2005 ACW3 - HARDENED Apache configuration (intended for httpd 2.4.69)
# -----------------------------------------------------------------------------
# Used by the `target-patched` service to demonstrate remediation. The PRIMARY
# remediation for all three CVEs is running the patched binary (2.4.69); the
# directives below add config-level defence-in-depth so the before/after demo
# shows both layers. Diff this against lab-vuln.conf for the report.
# =============================================================================

ServerRoot "/usr/local/apache2"
Listen 80
ServerName target-patched.acwlab.local:80

LoadModule mpm_event_module       modules/mod_mpm_event.so
LoadModule authn_core_module      modules/mod_authn_core.so
LoadModule authn_file_module      modules/mod_authn_file.so
LoadModule authz_core_module      modules/mod_authz_core.so
LoadModule authz_user_module      modules/mod_authz_user.so
LoadModule authz_host_module      modules/mod_authz_host.so
LoadModule auth_basic_module      modules/mod_auth_basic.so
LoadModule unixd_module           modules/mod_unixd.so
LoadModule log_config_module      modules/mod_log_config.so
LoadModule mime_module            modules/mod_mime.so
LoadModule dir_module             modules/mod_dir.so
LoadModule alias_module           modules/mod_alias.so
LoadModule headers_module         modules/mod_headers.so
LoadModule setenvif_module        modules/mod_setenvif.so
LoadModule filter_module          modules/mod_filter.so
LoadModule auth_digest_module     modules/mod_auth_digest.so
LoadModule dav_module             modules/mod_dav.so
LoadModule dav_fs_module          modules/mod_dav_fs.so
LoadModule proxy_module           modules/mod_proxy.so
LoadModule proxy_http_module      modules/mod_proxy_http.so
LoadModule xml2enc_module         modules/mod_xml2enc.so
LoadModule proxy_html_module      modules/mod_proxy_html.so

User daemon
Group daemon

# Do not leak the precise version/module build in the banner.
ServerTokens Prod
ServerSignature Off

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

ErrorLog  "/proc/self/fd/2"
CustomLog "/proc/self/fd/1" common
LogLevel  warn

# -----------------------------------------------------------------------------
# Scenario 1 remediation - CVE-2026-93546 (mod_dav_fs)
# Primary: patched binary (2.4.69) fixes the integer overflow.
# Defence-in-depth: restrict who may write, and cap request body size so an
# oversized PROPPATCH body cannot be submitted in the first place.
# -----------------------------------------------------------------------------
DavLockDB "/var/www/webdav/.davlock/lockdb"
Alias /webdav "/var/www/webdav/files"
<Location "/webdav">
    Dav On
    AuthType Basic
    AuthName "ACW3 WebDAV"
    AuthUserFile "/usr/local/apache2/conf/webdav.passwd"
    Require valid-user
    LimitXMLRequestBody 102400        # cap XML body (default 1MB) -> 100KB
    LimitRequestBody   1048576
</Location>

# -----------------------------------------------------------------------------
# Scenario 2 remediation - CVE-2026-73636 (mod_auth_digest)
# Primary: patched binary (2.4.69).
# Defence-in-depth: use a positive nonce lifetime (not 0) and serve digest
# only over TLS so a nonce cannot be captured off the wire for replay.
# -----------------------------------------------------------------------------
Alias /digest "/var/www/digest"
<Directory "/var/www/digest">
    Options Indexes
    AllowOverride None
</Directory>
<Location "/digest">
    AuthType Digest
    AuthName "ACW3 Restricted"
    AuthDigestProvider file
    AuthUserFile "/usr/local/apache2/conf/digest.passwd"
    AuthDigestNonceLifetime 300       # positive lifetime instead of 0
    Require valid-user
    # In production: wrap in <If "%{HTTPS} != 'on'"> redirect to https, or
    # require SSL so the nonce is never transmitted in cleartext.
</Location>

# -----------------------------------------------------------------------------
# Scenario 3 remediation - CVE-2026-63686 (mod_xml2enc)
# Primary: patched binary (2.4.69).
# Defence-in-depth: only proxy backends you control. If the HTML-rewriting /
# charset-transcoding feature is not needed, leave ProxyHTMLEnable Off so the
# xml2enc filter is never engaged.
# -----------------------------------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On
<Location "/proxy/">
    ProxyPass        "http://backend:8000/"
    ProxyPassReverse "http://backend:8000/"
    ProxyHTMLEnable  Off              # filter chain disabled -> surface removed
</Location>
