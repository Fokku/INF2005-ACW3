# =============================================================================
# INF2005 ACW3 - DELIBERATELY VULNERABLE Apache configuration (httpd 2.4.68)
# -----------------------------------------------------------------------------
# This file configures the three assessed CVEs as path-based scenarios on a
# single target, so the whole lab is one container on port 80:
#
#   /webdav/   mod_dav_fs        CVE-2026-93546  (integer overflow, PROPPATCH)
#   /digest/   mod_auth_digest   CVE-2026-73636  (one-time-nonce replay)
#   /proxy/    mod_xml2enc       CVE-2026-63686  (charset-conversion NULL deref)
#
# DO NOT deploy this configuration anywhere reachable from a real network.
# =============================================================================

ServerRoot "/usr/local/apache2"
Listen 80
ServerName target.acwlab.local:80

# --- Multi-Processing Module -------------------------------------------------
LoadModule mpm_event_module       modules/mod_mpm_event.so

# --- Core / infrastructure modules ------------------------------------------
LoadModule authn_core_module      modules/mod_authn_core.so
LoadModule authn_file_module      modules/mod_authn_file.so
LoadModule authz_core_module      modules/mod_authz_core.so
LoadModule authz_user_module      modules/mod_authz_user.so
LoadModule authz_host_module      modules/mod_authz_host.so
LoadModule auth_basic_module      modules/mod_auth_basic.so
LoadModule unixd_module           modules/mod_unixd.so
LoadModule log_config_module      modules/mod_log_config.so
LoadModule mime_module            modules/mod_mime.so
LoadModule dir_module             modules/mod_dir.so
LoadModule alias_module           modules/mod_alias.so
LoadModule headers_module         modules/mod_headers.so
LoadModule setenvif_module        modules/mod_setenvif.so
LoadModule filter_module          modules/mod_filter.so

# --- Modules under assessment ------------------------------------------------
LoadModule auth_digest_module     modules/mod_auth_digest.so   # CVE-2026-73636
LoadModule dav_module             modules/mod_dav.so           # CVE-2026-93546
LoadModule dav_fs_module          modules/mod_dav_fs.so        # CVE-2026-93546
LoadModule proxy_module           modules/mod_proxy.so         # CVE-2026-63686
LoadModule proxy_http_module      modules/mod_proxy_http.so    # CVE-2026-63686
LoadModule xml2enc_module         modules/mod_xml2enc.so       # CVE-2026-63686
LoadModule proxy_html_module      modules/mod_proxy_html.so    # CVE-2026-63686

User daemon
Group daemon

ServerTokens Full          # expose version banner so the version is verifiable
ServerSignature On

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

ErrorLog  "/proc/self/fd/2"
CustomLog "/proc/self/fd/1" common
# Raise per-module verbosity during the demo if useful, e.g.:
#   LogLevel info dav:debug dav_fs:debug auth_digest:debug proxy_html:debug xml2enc:debug
LogLevel  info

# -----------------------------------------------------------------------------
# Scenario 1 - CVE-2026-93546 : mod_dav_fs integer overflow via PROPPATCH
# -----------------------------------------------------------------------------
# An authenticated WebDAV client with write access is the pre-condition
# (CVSS PR:L). Basic auth gates the collection; writes (incl. PROPPATCH) are
# therefore available to an authenticated user, which is the vulnerable surface.
DavLockDB "/var/www/webdav/.davlock/lockdb"
Alias /webdav "/var/www/webdav/files"
<Location "/webdav">
    Dav On
    AuthType Basic
    AuthName "ACW3 WebDAV"
    AuthUserFile "/usr/local/apache2/conf/webdav.passwd"
    Require valid-user
</Location>

# -----------------------------------------------------------------------------
# Scenario 2 - CVE-2026-73636 : mod_auth_digest one-time-nonce replay
# -----------------------------------------------------------------------------
# AuthDigestNonceLifetime 0 is the vulnerable setting: it is meant to make each
# nonce single-use, but on affected builds a captured nonce can be replayed to
# bypass authentication (CWE-294, capture-replay).
Alias /digest "/var/www/digest"
<Directory "/var/www/digest">
    Options Indexes
    AllowOverride None
</Directory>
<Location "/digest">
    AuthType Digest
    AuthName "ACW3 Restricted"
    AuthDigestProvider file
    AuthUserFile "/usr/local/apache2/conf/digest.passwd"
    AuthDigestNonceLifetime 0
    Require valid-user
</Location>

# -----------------------------------------------------------------------------
# Scenario 3 - CVE-2026-63686 : mod_xml2enc NULL-pointer deref (DoS)
# -----------------------------------------------------------------------------
# httpd reverse-proxies an untrusted backend and runs its responses through the
# proxy_html/xml2enc filter chain. A backend response whose declared charset
# conversion partly succeeds then fails reaches the vulnerable code path.
ProxyRequests Off
ProxyPreserveHost On
<Location "/proxy/">
    ProxyPass        "http://backend:8000/"
    ProxyPassReverse "http://backend:8000/"
    ProxyHTMLEnable  On
    ProxyHTMLExtended On
    # mod_xml2enc inserts itself into this filter chain to transcode the
    # backend's declared charset before mod_proxy_html rewrites links.
</Location>
